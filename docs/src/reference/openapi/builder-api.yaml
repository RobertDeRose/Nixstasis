openapi: 3.0.3
info:
  title: Nixstasis Builder Schema API
  version: 1.0.0
  description: |
    Legacy /api/v1 compatibility wrapper for Ash-backed schema-derived alert and
    report builder actions. Generated /api/json builder action contracts are
    emitted in packages/server/priv/static/openapi.yaml. These wrappers preserve
    their application/json shapes and compatibility pipeline; generated routes
    have separate bearer/report-view authorization and JSON:API errors.
paths:
  /api/v1/builder-schemas:
    get:
      summary: List schema references available to builder clients
      responses:
        "200":
          description: Available schemas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SchemaReference"
  /api/v1/builder-schemas/{schema_id}/versions/{schema_version}/options:
    get:
      summary: Get normalized dropdown options for a builder and schema version
      parameters:
        - in: path
          name: schema_id
          required: true
          schema:
            type: string
        - in: path
          name: schema_version
          required: true
          schema:
            type: string
        - in: query
          name: builder
          required: false
          schema:
            type: string
            enum: [alert, report]
            default: alert
      responses:
        "200":
          description: Dropdown options
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SchemaOptionsResponse"
        "404":
          description: Schema reference not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
        "422":
          description: Invalid schema options request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
  /api/v1/builder-configurations/validate:
    post:
      summary: Validate builder selections against an active schema version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationRequest"
      responses:
        "200":
          description: Validation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "422":
          description: Invalid validation payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
components:
  schemas:
    LegacyError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    SchemaReference:
      type: object
      required: [schema_id, schema_version]
      properties:
        schema_id:
          type: string
        schema_version:
          type: string
        product_name:
          type: string
        readable:
          type: boolean
    SchemaOption:
      type: object
      required: [key, label, selectable]
      properties:
        key:
          type: string
        label:
          type: string
        value_type:
          type: string
        order_index:
          type: integer
          minimum: 0
        selectable:
          type: boolean
    SchemaOptionsResponse:
      type: object
      required: [schema_id, schema_version, builder, options, load_time_ms]
      properties:
        schema_id:
          type: string
        schema_version:
          type: string
        builder:
          type: string
          enum: [alert, report]
        options:
          type: array
          items:
            $ref: "#/components/schemas/SchemaOption"
        load_time_ms:
          type: integer
          minimum: 0
    ValidationRequest:
      type: object
      required: [builder, schema_id, schema_version, selections]
      properties:
        builder:
          type: string
          enum: [alert, report]
        schema_id:
          type: string
        schema_version:
          type: string
        selections:
          type: array
          items:
            type: object
            required: [slot_id, selected_key]
            properties:
              slot_id:
                type: string
              selected_key:
                type: string
    ValidationResponse:
      type: object
      required: [valid, issues, cleared_slot_ids]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
        cleared_slot_ids:
          type: array
          items:
            type: string
    ValidationIssue:
      type: object
      required: [issue_code, message, blocking]
      properties:
        issue_code:
          type: string
          enum: [invalid_schema_field, schema_unavailable, schema_access_lost]
        message:
          type: string
        slot_id:
          type: string
          nullable: true
        blocking:
          type: boolean
