openapi: 3.0.3
info:
  title: Nixstasis Report API
  version: 1.0.0
  description: Bespoke Phoenix controller API for custom report result previews.
paths:
  /api/v1/reports/{id}/results:
    get:
      summary: Fetch custom report result rows
      description: Runs a custom report and returns its selected fields plus result rows.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Report result data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [fields, rows]
                    properties:
                      fields:
                        type: array
                        items:
                          type: string
                      rows:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
        "404":
          description: Report not found or report result unavailable
