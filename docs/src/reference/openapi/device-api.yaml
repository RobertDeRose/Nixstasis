openapi: 3.0.3
info:
  title: Nixstasis Device API
  version: 1.0.0
  description: Compatibility API used by managed devices and Caddy TLS approval. Device runtime routes have additive Ash-backed counterparts under /api/json/device_runtime/devices. The compatibility surface preserves Go-client token, authentication, status-code, and response-shape behavior. The deviceApiKey query scheme applies to heartbeat and command operations; registration and list have no application device key. The Caddy ask endpoint remains retained-controller because it is a Caddy-only ingress workflow, not a product data resource.
paths:
  /api/v1/devices:
    get:
      security: []
      summary: List devices with optional filters
      description: Current compatibility controller contract. The additive generated list action is the canonical Ash contract; preserve device list filters and compatibility semantics, including ipv4_address, in both references.
      parameters:
        - in: query
          name: product
          schema:
            type: string
        - in: query
          name: account_number
          schema:
            type: string
        - in: query
          name: approval_status
          schema:
            type: string
            enum: [pending, approved, rejected]
        - in: query
          name: connectivity_status
          schema:
            type: string
            enum: [online, offline]
        - in: query
          name: ipv4_address
          schema:
            type: string
            format: ipv4
          description: Filters devices by exact IPv4 address and is echoed in `meta.active_filters` when present.
      responses:
        "200":
          description: Device list response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  meta:
                    type: object
                    properties:
                      active_filters:
                        type: object
                        additionalProperties: true
        "429":
          description: Device-list rate limit exceeded
  /api/v1/devices/register:
    post:
      security: []
      summary: Register a managed device
      description: Registration is the credential issuance boundary. Public registration requires a schema payload. Approved devices receive an API token; pending devices do not. The additive generated registration action shares this behavior; compatibility tests preserve pending and approved token behavior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mac_address]
              properties:
                mac_address:
                  type: string
                  example: "00:11:22:33:44:55"
                product_name:
                  type: string
                  example: atom-001122334455
                schema_definition:
                  type: object
                  required: [product]
                  additionalProperties: true
                  description: Product schema used to validate registration. Legacy clients may send the same object as `schema`.
                  example:
                    product: atom-001122334455
                    type: object
                    properties:
                      temp:
                        type: number
                schema:
                  type: object
                  additionalProperties: true
                  deprecated: true
                  description: Legacy alias for `schema_definition`.
                metadata:
                  type: object
                  additionalProperties: true
                ipv4_address:
                  type: string
                  format: ipv4
                  description: Optional direct IPv4 value; when absent, registration may use metadata.ip_address.
              anyOf:
                - required: [schema_definition]
                - required: [schema]
      responses:
        "201":
          description: Registration accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      mac_address:
                        type: string
                      product_name:
                        type: string
                      account_number:
                        type: string
                        nullable: true
                      approval_status:
                        type: string
                        enum: [pending, approved, rejected]
                      last_seen_at:
                        type: string
                        format: date-time
                        nullable: true
                      schema:
                        type: object
                        additionalProperties: true
                      metadata:
                        type: object
                        additionalProperties: true
                      remote_access_requested:
                        type: boolean
                      api_token:
                        type: string
                        nullable: true
                        description: Present only after server approval.
        "422":
          description: Missing or invalid registration schema
        "429":
          description: Registration rate limit exceeded
  /api/v1/devices/{id}/heartbeat:
    post:
      security:
        - deviceApiKey: []
      summary: Submit device heartbeat and telemetry
      description: Current compatibility controller contract with an additive generated heartbeat action. Preserve api_key authentication, device approval checks, telemetry ingestion, remote-access token behavior, and command polling through Go-client compatibility tests.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: api_key
          required: true
          schema:
            type: string
          description: Device runtime token issued after approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                telemetry:
                  type: object
                  additionalProperties: true
                connection_status:
                  type: object
                  properties:
                    active:
                      type: boolean
                    connection_string:
                      type: string
                    pid:
                      type: integer
                    start_time:
                      type: string
                      format: date-time
                    error:
                      type: string
                      description: Client-side FRP profile or lifecycle error reported after a failed safe decision.
                command_inventory:
                  type: object
                  additionalProperties: true
                  description: Optional untrusted package and command evidence collected from the latest server probe.
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      remote_access_token:
                        type: string
                        nullable: true
                        description: Shared FRPS token. Non-empty means client should start/keep FRPC; absent or empty means stop/remain stopped.
                      remote_access_profile:
                        type: object
                        nullable: true
                        description: Versioned named reference to a client-owned route profile. The server never sends FRPC configuration or local targets.
                        properties:
                          name:
                            type: string
                          version:
                            type: integer
                      commands:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommandRequest"
                      command_inventory_probe:
                        type: object
                        additionalProperties: true
                        description: Optional server-owned probe manifest describing requested package and command evidence.
        "401":
          description: Missing or invalid API key
        "403":
          description: Device is not approved
        "404":
          description: Device not found
        "422":
          description: Heartbeat processing failed
        "429":
          description: Heartbeat rejected by rate limit
  /api/v1/devices/{id}/command_results:
    post:
      security:
        - deviceApiKey: []
      summary: Submit command execution results
      description: Current compatibility controller contract with an additive generated command-result action. Preserve api_key authentication, replay/duplicate command handling, acknowledged_count shape, malformed-results status, and rate-limit behavior through compatibility tests.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: api_key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  items:
                    $ref: "#/components/schemas/CommandResult"
      responses:
        "202":
          description: Command results accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      acknowledged_count:
                        type: integer
        "400":
          description: Missing or malformed results list
        "401":
          description: Missing or invalid API key
        "403":
          description: Device is not approved
        "404":
          description: Device not found
        "429":
          description: Command-result rate limit exceeded
  /api/v1/devices/{id}/command_payloads/{ref}:
    get:
      security:
        - deviceApiKey: []
      summary: Fetch deferred command payload
      description: Current compatibility controller contract with an additive generated payload-fetch action. Preserve api_key authentication, payload lookup, payload shape, and 404 behavior through compatibility tests.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: ref
          required: true
          schema:
            type: string
        - in: query
          name: api_key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Command payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandPayload"
        "401":
          description: Missing or invalid API key
        "403":
          description: Device is not approved
        "404":
          description: Device or payload not found
        "429":
          description: Payload-fetch rate limit exceeded
  /api/v1/check_domain:
    get:
      summary: Authorize Caddy on-demand TLS host
      description: Retained as a controller route because it is Caddy's on-demand TLS ask endpoint with simple ingress allow/deny semantics, not a durable product data resource.
      parameters:
        - in: query
          name: domain
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Domain is permitted
        "401":
          description: Domain is not permitted
components:
  securitySchemes:
    deviceApiKey:
      type: apiKey
      in: query
      name: api_key
      description: Registration-issued device token used by runtime heartbeat and command operations.
  schemas:
    CommandRequest:
      type: object
      properties:
        command_id:
          type: string
        type:
          type: string
          enum: [list_scripts, install_script, remove_script, ssh_authorize, ssh_revoke]
          description: Dynamic SSH authorization commands use the exact versioned payload below; `ssh_revoke` removes a terminal session from the client in-memory store.
        args:
          type: array
          items:
            type: string
        public_key:
          type: string
          description: Full authorized_keys-style SSH public key. Present only for `ssh_authorize` and remains top-level for client compatibility.
        payload_ref:
          type: string
        payload:
          type: object
          description: For SSH commands, this object has the exact versioned content_type, name, and data fields described below; other command types may use their existing payload shape.
          properties:
            content_type:
              type: string
              enum:
                - application/vnd.nixstasis.ssh-authorize+json;version=1
                - application/vnd.nixstasis.ssh-revoke+json;version=1
              description: Exact versioned dynamic SSH command content type.
            name:
              type: string
              format: uuid
              description: Terminal session ref; must match data.session_ref.
            data:
              type: string
              description: JSON-encoded metadata. Authorize data includes target_user=nixstasis-support, ttl_seconds, and session_ref; revoke data includes session_ref.
          additionalProperties: true
    CommandResult:
      type: object
      required: [command_id, status]
      properties:
        command_id:
          type: string
        status:
          type: string
          enum: [OK, FAILED]
        output:
          type: object
          additionalProperties: true
        error:
          type: string
          nullable: true
    CommandPayload:
      type: object
      properties:
        content_type:
          type: string
        name:
          type: string
        data:
          type: string
