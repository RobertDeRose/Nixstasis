openapi: 3.0.3
info:
  title: Nixstasis Device API
  version: 1.0.0
  description: Bespoke Phoenix controller API used by managed devices and Caddy TLS approval. Device runtime routes are deferred from Ash conversion until strict Go client compatibility tests cover token, status-code, and response-shape behavior. The Caddy ask endpoint remains retained-controller because it is an ingress workflow boundary called by Caddy, not a product data resource.
paths:
  /api/v1/devices:
    get:
      summary: List devices with optional filters
      description: Deferred from Ash conversion until device list filters and compatibility semantics, including ipv4_address, are reconciled with generated documentation.
      parameters:
        - in: query
          name: product
          schema:
            type: string
        - in: query
          name: account_number
          schema:
            type: string
        - in: query
          name: approval_status
          schema:
            type: string
            enum: [pending, approved, rejected]
        - in: query
          name: connectivity_status
          schema:
            type: string
            enum: [online, offline]
        - in: query
          name: ipv4_address
          schema:
            type: string
            format: ipv4
          description: Filters devices by exact IPv4 address and is echoed in `meta.active_filters` when present.
      responses:
        "200":
          description: Device list response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /api/v1/devices/register:
    post:
      summary: Register a managed device
      description: Registration is the credential issuance boundary. Public registration requires a schema payload. Approved devices receive an API token; pending devices do not. Deferred from Ash conversion until Go client registration compatibility tests cover pending and approved token behavior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mac_address, schema_definition]
              properties:
                mac_address:
                  type: string
                  example: "00:11:22:33:44:55"
                product_name:
                  type: string
                  example: atom-001122334455
                schema_definition:
                  type: object
                  required: [product]
                  additionalProperties: true
                  description: Product schema used to validate registration. Legacy clients may send the same object as `schema`.
                  example:
                    product: atom-001122334455
                    type: object
                    properties:
                      temp:
                        type: number
                schema:
                  type: object
                  additionalProperties: true
                  deprecated: true
                  description: Legacy alias for `schema_definition`.
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Registration accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      api_token:
                        type: string
                        nullable: true
                        description: Present only after server approval.
        "422":
          description: Missing or invalid registration schema
  /api/v1/devices/{id}/heartbeat:
    post:
      summary: Submit device heartbeat and telemetry
      description: Deferred from Ash conversion until Go client heartbeat compatibility tests cover api_key authentication, device approval checks, telemetry ingestion, remote-access token behavior, and command polling.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: api_key
          required: true
          schema:
            type: string
          description: Device runtime token issued after approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                telemetry:
                  type: object
                  additionalProperties: true
                connection_status:
                  type: object
                  properties:
                    active:
                      type: boolean
                    connection_string:
                      type: string
                    pid:
                      type: integer
                    start_time:
                      type: string
                      format: date-time
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      remote_access_token:
                        type: string
                        nullable: true
                        description: Shared FRPS token. Non-empty means client should start/keep FRPC; absent or empty means stop/remain stopped.
                      commands:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommandRequest"
        "401":
          description: Missing or invalid API key
        "403":
          description: Device is not approved
        "429":
          description: Heartbeat rejected by rate limit
  /api/v1/devices/{id}/command_results:
    post:
      summary: Submit command execution results
      description: Deferred from Ash conversion until command-result compatibility tests cover api_key authentication, duplicate command handling, acknowledged_count shape, and processing-error status codes.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: api_key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  items:
                    $ref: "#/components/schemas/CommandResult"
      responses:
        "202":
          description: Command results accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      acknowledged_count:
                        type: integer
        "400":
          description: Missing or malformed results list
        "401":
          description: Missing or invalid API key
        "403":
          description: Device is not approved
        "404":
          description: Device not found
        "422":
          description: Command result processing failed
  /api/v1/devices/{id}/command_payloads/{ref}:
    get:
      summary: Fetch deferred command payload
      description: Deferred from Ash conversion until command-payload compatibility tests cover api_key authentication, payload lookup, payload shape, and 404 behavior.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: ref
          required: true
          schema:
            type: string
        - in: query
          name: api_key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Command payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandPayload"
        "401":
          description: Missing or invalid API key
        "403":
          description: Device is not approved
        "404":
          description: Device or payload not found
  /api/v1/check_domain:
    get:
      summary: Authorize Caddy on-demand TLS host
      description: Retained as a controller route because it is Caddy's on-demand TLS ask endpoint with simple ingress allow/deny semantics, not a durable product data resource.
      parameters:
        - in: query
          name: domain
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Domain is permitted
        "401":
          description: Domain is not permitted
components:
  schemas:
    CommandRequest:
      type: object
      properties:
        command_id:
          type: string
        type:
          type: string
          enum: [list_scripts, install_script, remove_script, ssh_authorize]
        args:
          type: array
          items:
            type: string
        public_key:
          type: string
          description: SSH public key used when `type` is `ssh_authorize`.
        payload_ref:
          type: string
        payload:
          type: object
          additionalProperties: true
    CommandResult:
      type: object
      required: [command_id, status]
      properties:
        command_id:
          type: string
        status:
          type: string
          enum: [OK, FAILED]
        output:
          type: object
          additionalProperties: true
        error:
          type: string
          nullable: true
    CommandPayload:
      type: object
      properties:
        content_type:
          type: string
        name:
          type: string
        data:
          type: string
