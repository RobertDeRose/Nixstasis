services:
  nixstasis:
    build:
      context: ../../packages
      dockerfile: server/Dockerfile
    env_file: !override
      - laptop.env
    environment:
      PHX_SERVER: "true"
      PORT: ${PORT:-4000}
    ports:
      - "127.0.0.1:${PORT:-4000}:${PORT:-4000}"

  caddy:
    build:
      context: ../../packages/caddy
      dockerfile: Dockerfile
    env_file: !override
      - laptop.env
    ports: !override
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./caddy/Caddyfile.laptop:/etc/caddy/Caddyfile:ro
      - caddy-laptop-data:/data
      - caddy-laptop-config:/config

  frps:
    build:
      context: ../../packages/frp
      dockerfile: Dockerfile
    env_file: !override
      - laptop.env
    ports: !override
      - "127.0.0.1:${FRPS_BIND_PORT:-7000}:${FRPS_BIND_PORT:-7000}"
      - "127.0.0.1:${FRPS_HTTP_PORT:-8080}:${FRPS_HTTP_PORT:-8080}"
      - "127.0.0.1:${FRPS_TCPMUX_PORT:-2022}:${FRPS_TCPMUX_PORT:-2022}"

  postgres:
    env_file: !override
      - laptop.env
    volumes:
      - postgres-laptop-data:/var/lib/postgresql/data

  laptop-ssh:
    image: ${LAPTOP_SSH_IMAGE_REF}
    environment:
      PUID: "1000"
      PGID: "1000"
      PASSWORD_ACCESS: "false"
      USER_NAME: nixstasis
    ports:
      - "127.0.0.1:${LAPTOP_SSH_PORT:-2222}:2222"
    volumes:
      - laptop-ssh-config:/config
      - ./.laptop-client/authorized_keys:/config/.ssh/authorized_keys:ro
    restart: unless-stopped

volumes:
  caddy-laptop-data:
  caddy-laptop-config:
  postgres-laptop-data:
  laptop-ssh-config:
