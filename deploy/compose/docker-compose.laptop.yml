services:
  nixstasis:
    build:
      context: ../../packages
      dockerfile: ../../packages/server/Dockerfile
    env_file: !override
      - laptop.env
    environment:
      PHX_SERVER: "true"
      PORT: ${PORT:-4000}

  caddy:
    build:
      context: ../../packages/caddy
      dockerfile: ../../packages/caddy/Dockerfile
    env_file: !override
      - laptop.env
    ports: !override
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./caddy/Caddyfile.laptop:/etc/caddy/Caddyfile:ro
      - caddy-laptop-data:/data
      - caddy-laptop-config:/config

  frps:
    build:
      context: ../../packages/frp
      dockerfile: ../../packages/frp/Dockerfile
    env_file: !override
      - laptop.env
    ports: !override
      - "127.0.0.1:${FRPS_BIND_PORT:-7000}:${FRPS_BIND_PORT:-7000}"
      - "127.0.0.1:${FRPS_HTTP_PORT:-8080}:${FRPS_HTTP_PORT:-8080}"
      - "127.0.0.1:${FRPS_TCPMUX_PORT:-2022}:${FRPS_TCPMUX_PORT:-2022}"

  postgres:
    env_file: !override
      - laptop.env
    volumes:
      - postgres-laptop-data:/var/lib/postgresql/data

volumes:
  caddy-laptop-data:
  caddy-laptop-config:
  postgres-laptop-data:
