bindPort = "__FRPS_BIND_PORT__"

auth.method = "token"
auth.token = "nixstasis-frp-plugin-gated"

[[httpPlugins]]
name = "nixstasis-device-authorization"
addr = "nixstasis:4000"
path = "/internal/frp/authorize"
ops = ["Login", "NewProxy"]

webServer.port = "__FRPS_DASHBOARD_PORT__"
webServer.user = "__FRPS_DASHBOARD_USER__"
webServer.password = "__FRPS_DASHBOARD_PASSWORD__"

log.to = "console"
log.level = "info"

tcpmuxHTTPConnectPort = "__FRPS_TCPMUX_PORT__"
vhostHTTPPort = "__FRPS_HTTP_PORT__"
subDomainHost = "__BASE_DOMAIN__"
