services:
  nixstasis:
    image: ghcr.io/sfero-nixstasis/nixstasis-server:${NIXSTASIS_SERVER_IMAGE_TAG:-latest}
    build:
      context: ../../packages/server
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PHX_SERVER: "true"
      PORT: ${PORT:-4000}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  caddy:
    image: ghcr.io/sfero-nixstasis/nixstasis-caddy:${NIXSTASIS_CADDY_IMAGE_TAG:-latest}
    build:
      context: ../../packages/caddy
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nixstasis
      - frps
    restart: unless-stopped

  frps:
    image: docker.io/snowdreamtech/frps@${FRPS_IMAGE_DIGEST}
    command:
      - /bin/sh
      - -c
      - |
        sed \
          -e "s/\"__FRPS_BIND_PORT__\"/${FRPS_BIND_PORT}/g" \
          -e "s/\"__FRPS_DASHBOARD_PORT__\"/${FRPS_DASHBOARD_PORT}/g" \
          -e "s/\"__FRPS_TCPMUX_PORT__\"/${FRPS_TCPMUX_PORT}/g" \
          -e "s/\"__FRPS_HTTP_PORT__\"/${FRPS_HTTP_PORT}/g" \
          -e "s/__BASE_DOMAIN__/${BASE_DOMAIN}/g" \
          /etc/frp/frps.toml.template > /tmp/frps.toml && exec frps -c /tmp/frps.toml
    env_file:
      - .env
    ports:
      - "${FRPS_BIND_PORT}:${FRPS_BIND_PORT}"
      - "${FRPS_HTTP_PORT}:${FRPS_HTTP_PORT}"
      - "${FRPS_DASHBOARD_PORT}:${FRPS_DASHBOARD_PORT}"
      - "${FRPS_TCPMUX_PORT}:${FRPS_TCPMUX_PORT}"
    volumes:
      - ./frps/frps.toml:/etc/frp/frps.toml.template:ro
    restart: unless-stopped

  postgres:
    image: docker.io/postgres:17.5-bookworm@${POSTGRES_IMAGE_DIGEST}
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nixstasis}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nixstasis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - bundled-db
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
