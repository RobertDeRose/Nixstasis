services:
  nixstasis:
    image: ${NIXSTASIS_SERVER_IMAGE_REF:-nixstasis-server:dev}
    build:
      context: ../../packages
      dockerfile: server/Dockerfile
      args:
        NIXSTASIS_SESSION_COOKIE_SECURE: ${NIXSTASIS_SESSION_COOKIE_SECURE:-true}
    environment:
      PHX_SERVER: "true"
      PORT: ${PORT:-4000}
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST}
      BASE_DOMAIN: ${BASE_DOMAIN}
      CHECK_ORIGIN_EXTRA: ${CHECK_ORIGIN_EXTRA:-localhost,127.0.0.1}
      NIXSTASIS_FORCE_SSL: ${NIXSTASIS_FORCE_SSL:-true}
      NIXSTASIS_TLS_OBSERVATIONS_ENABLED: ${NIXSTASIS_TLS_OBSERVATIONS_ENABLED:-false}
      NIXSTASIS_TLS_OBSERVATIONS_TOKEN: ${NIXSTASIS_TLS_OBSERVATIONS_TOKEN:-}
      NIXSTASIS_E2E_ENABLED: ${NIXSTASIS_E2E_ENABLED:-false}
      NIXSTASIS_E2E_RUNNER_ID: ${NIXSTASIS_E2E_RUNNER_ID:-}
      NIXSTASIS_E2E_RUNNER_TOKEN: ${NIXSTASIS_E2E_RUNNER_TOKEN:-}
      NIXSTASIS_LOCAL_BROWSER_AUTH_FALLBACK: ${NIXSTASIS_LOCAL_BROWSER_AUTH_FALLBACK:-false}
      NIXSTASIS_PROXY_AUTH_TOKEN: ${NIXSTASIS_PROXY_AUTH_TOKEN}
      FRPS_TCPMUX_PORT: ${FRPS_TCPMUX_PORT}
      NIXSTASIS_SSH_FRP_HOST: ${NIXSTASIS_SSH_FRP_HOST:-frps}
    ports:
      - "${PHOENIX_BIND_HOST:-127.0.0.1}:${PORT:-4000}:${PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    networks:
      default:
        aliases:
          - nixstasis.${BASE_DOMAIN}
    image: ${NIXSTASIS_CADDY_IMAGE_REF:-nixstasis-caddy:dev}
    build:
      context: ../../packages/caddy
      dockerfile: Dockerfile
    environment:
      PORT: ${PORT:-4000}
      BASE_DOMAIN: ${BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      TENANT_ID: ${TENANT_ID}
      JWT_KEY: ${JWT_KEY}
      AUTHORIZED_ROLES: ${AUTHORIZED_ROLES}
      AUTHORIZED_GROUPS: ${AUTHORIZED_GROUPS}
      NIXSTASIS_VIEWER_GROUPS: ${NIXSTASIS_VIEWER_GROUPS}
      NIXSTASIS_OPERATOR_GROUPS: ${NIXSTASIS_OPERATOR_GROUPS}
      NIXSTASIS_ADMIN_GROUPS: ${NIXSTASIS_ADMIN_GROUPS}
      NIXSTASIS_PROXY_AUTH_TOKEN: ${NIXSTASIS_PROXY_AUTH_TOKEN}
      FRPS_DASHBOARD_PORT: ${FRPS_DASHBOARD_PORT}
      FRPS_HTTP_PORT: ${FRPS_HTTP_PORT}
    ports:
      - "${BIND_HOST:-0.0.0.0}:80:80"
      - "${BIND_HOST:-0.0.0.0}:443:443"
    volumes:
      - ${CADDY_CONFIG:-./caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nixstasis
      - frps
    restart: unless-stopped

  frps:
    image: ${NIXSTASIS_FRPS_IMAGE_REF:-nixstasis-frps:dev}
    build:
      context: ../../packages/frp
      dockerfile: Dockerfile
      args:
        FRP_VERSION: ${FRP_VERSION}
        FRP_LINUX_AMD64_SHA256: ${FRP_LINUX_AMD64_SHA256}
        FRP_LINUX_ARM64_SHA256: ${FRP_LINUX_ARM64_SHA256}
    command:
      - /bin/sh
      - -c
      - |
        frps-render-config.sh /etc/frp/frps.toml.template /tmp/frps.toml &&
          exec frps -c /tmp/frps.toml
    environment:
      FRPS_DASHBOARD_USER: ${FRPS_DASHBOARD_USER}
      FRPS_DASHBOARD_PASSWORD: ${FRPS_DASHBOARD_PASSWORD}
      BASE_DOMAIN: ${BASE_DOMAIN}
      FRPS_BIND_PORT: ${FRPS_BIND_PORT}
      FRPS_DASHBOARD_PORT: ${FRPS_DASHBOARD_PORT}
      FRPS_TCPMUX_PORT: ${FRPS_TCPMUX_PORT}
      FRPS_HTTP_PORT: ${FRPS_HTTP_PORT}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${FRPS_BIND_PORT}:${FRPS_BIND_PORT}"
    volumes:
      - ./frps/frps.toml:/etc/frp/frps.toml.template:ro
    restart: unless-stopped

  postgres:
    image: docker.io/postgres:${POSTGRES_VERSION:?POSTGRES_VERSION is required}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nixstasis}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nixstasis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  client:
    image: ${NIXSTASIS_CLIENT_IMAGE_REF:-nixstasis-client:dev}
    build:
      context: ../../packages/client
      dockerfile: Dockerfile
      args:
        FRP_VERSION: ${FRP_VERSION}
        FRP_LINUX_AMD64_SHA256: ${FRP_LINUX_AMD64_SHA256}
        FRP_LINUX_ARM64_SHA256: ${FRP_LINUX_ARM64_SHA256}
    environment:
      NIXSTASIS_API_URL: ${NIXSTASIS_API_URL:-https://nixstasis.${BASE_DOMAIN}}
      NIXSTASIS_FRP_SERVER_ADDR: frps
      NIXSTASIS_FRP_SERVER_PORT: ${FRPS_BIND_PORT}
      NIXSTASIS_FRP_HTTP_LOCAL_ADDR: ${NIXSTASIS_FRP_HTTP_LOCAL_ADDR:-127.0.0.1:443}
      NIXSTASIS_SIMULATOR_HTTP_ENABLED: ${NIXSTASIS_SIMULATOR_HTTP_ENABLED:-false}
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    depends_on:
      - nixstasis
      - frps
      - caddy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
