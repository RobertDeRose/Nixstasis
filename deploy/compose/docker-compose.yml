services:
  nixstasis:
    image: ${NIXSTASIS_SERVER_IMAGE_REF}
    build:
      context: ../../packages
      dockerfile: ../../packages/server/Dockerfile
    env_file:
      - .env
    environment:
      PHX_SERVER: "true"
      PORT: ${PORT}
    restart: unless-stopped

  caddy:
    image: ${NIXSTASIS_CADDY_IMAGE_REF}
    build:
      context: ../../packages/caddy
      dockerfile: ../../packages/caddy/Dockerfile
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nixstasis
      - frps
    restart: unless-stopped

  frps:
    image: ${NIXSTASIS_FRPS_IMAGE_REF}
    build:
      context: ../../packages/frp
      dockerfile: ../../packages/frp/Dockerfile
    command:
      - /bin/sh
      - -c
      - |
        : "$${FRPS_AUTH_TOKEN:?FRPS_AUTH_TOKEN is required}"
        : "$${FRPS_DASHBOARD_USER:?FRPS_DASHBOARD_USER is required}"
        : "$${FRPS_DASHBOARD_PASSWORD:?FRPS_DASHBOARD_PASSWORD is required}"
        escaped_frps_auth_token=$$(printf '%s' "$$FRPS_AUTH_TOKEN" | sed 's/[\/&]/\\&/g')
        escaped_frps_dashboard_user=$$(printf '%s' "$$FRPS_DASHBOARD_USER" | sed 's/[\/&]/\\&/g')
        escaped_frps_dashboard_password=$$(printf '%s' "$$FRPS_DASHBOARD_PASSWORD" | sed 's/[\/&]/\\&/g')
        sed \
          -e "s/\"__FRPS_BIND_PORT__\"/${FRPS_BIND_PORT}/g" \
          -e "s/\"__FRPS_DASHBOARD_PORT__\"/${FRPS_DASHBOARD_PORT}/g" \
          -e "s/__FRPS_DASHBOARD_USER__/$${escaped_frps_dashboard_user}/g" \
          -e "s/__FRPS_DASHBOARD_PASSWORD__/$${escaped_frps_dashboard_password}/g" \
          -e "s/\"__FRPS_TCPMUX_PORT__\"/${FRPS_TCPMUX_PORT}/g" \
          -e "s/\"__FRPS_HTTP_PORT__\"/${FRPS_HTTP_PORT}/g" \
          -e "s/__FRPS_AUTH_TOKEN__/$${escaped_frps_auth_token}/g" \
          -e "s/__BASE_DOMAIN__/${BASE_DOMAIN}/g" \
          /etc/frp/frps.toml.template > /tmp/frps.toml && exec frps -c /tmp/frps.toml
    env_file:
      - .env
    ports:
      - "${FRPS_BIND_PORT}:${FRPS_BIND_PORT}"
      - "${FRPS_HTTP_PORT}:${FRPS_HTTP_PORT}"
      - "${FRPS_TCPMUX_PORT}:${FRPS_TCPMUX_PORT}"
    volumes:
      - ./frps/frps.toml:/etc/frp/frps.toml.template:ro
    restart: unless-stopped

  postgres:
    image: docker.io/postgres:${POSTGRES_VERSION}@${POSTGRES_IMAGE_DIGEST}
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nixstasis}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nixstasis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - bundled-db
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
