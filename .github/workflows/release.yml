name: Release
run-name: Release ${{ github.ref_name }}

# Releases fast-forward main to the validated dev commit, tag it, build every
# artifact with the computed version, and publish the GitHub release with the
# cocogitto changelog. No version commit is created, so main never diverges
# from dev. The publish job waits for approval through the `release`
# environment, which also holds the deploy key allowed to update main.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  MISE_IGNORED_CONFIG_PATHS: /home/runner/.config/mise/config.toml

jobs:
  plan:
    name: Plan release
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # ratchet:jdx/mise-action@v5.1.1
        with:
          install: false
      - name: Install cocogitto
        run: mise install --locked cocogitto
      - name: Compute version and release notes
        id: plan
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if git ls-remote --exit-code --heads origin main >/dev/null; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor FETCH_HEAD "$sha"; then
              echo "main is not an ancestor of dev; a fast-forward release is impossible" >&2
              exit 1
            fi
          fi
          tag=$(mise x -- cog bump --auto --dry-run)
          version=${tag#v}
          git tag "$tag" "$sha"
          mise x -- cog changelog --at "$tag" | tail -n +2 > release-notes.md
          {
            echo "version=$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release $tag from \`${sha:0:12}\`"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: release-notes
          path: release-notes.md

  validate:
    name: Validate
    needs: plan
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.plan.outputs.sha }}

  publish:
    name: Fast-forward main and tag
    needs: [plan, validate]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Fast-forward main and push the tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A plain push is rejected unless it fast-forwards main.
          git push origin "$SHA:refs/heads/main"
          # Reruns reuse an existing tag only when it already marks this commit.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            test "$(git rev-parse "v$VERSION^{commit}")" = "$SHA"
          else
            git tag -a "v$VERSION" -m "release: v$VERSION" "$SHA"
            git push origin "refs/tags/v$VERSION"
          fi
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          name: release-notes
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 ||
            gh release create "v$VERSION" --draft --verify-tag \
              --title "v$VERSION" --notes-file release-notes.md

  server-image:
    needs: [plan, publish]
    uses: ./.github/workflows/build_server_image.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.plan.outputs.version }}

  caddy-image:
    needs: [plan, publish]
    uses: ./.github/workflows/build_caddy_image.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.plan.outputs.version }}

  frps-image:
    needs: [plan, publish]
    uses: ./.github/workflows/build_frps_image.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.plan.outputs.version }}

  client:
    needs: [plan, publish]
    uses: ./.github/workflows/release_client.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.plan.outputs.version }}

  finalize:
    name: Publish release
    needs: [plan, server-image, caddy-image, frps-image, client]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false
