name: Build Packages
run-name: Building Package for ${{ github.ref_name }}

on:
  push:
    tags:
      - "*/v*"
      - "v*"

jobs:
  check-configs:
    name: Checking Build Request
    runs-on: ubuntu-24.04

    outputs:
      package: ${{ steps.parameters.outputs.package }}
      version: ${{ steps.parameters.outputs.version }}
      distros: ${{ steps.parameters.outputs.distros }}
      arches: ${{ steps.parameters.outputs.arches }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Get Parameters
        id: parameters
        run: |
          package="packages/${GITHUB_REF_NAME%/*}"

          if grep -qP "packages/v(\d+\.){2,3}(\d+)?" <<< "${package}"; then
            package="packages/server"
          fi

          if [[ ! -e "${package}" || ! -e "${package}/package_options.yml" ]]; then
            echo "Invalid Build Request, there is no ${package} folder or 'package_options.yml' is missing"
            exit 1
          fi

          cd "${package}"

          PKG_TYPE=$(yq '.package-type' package_options.yml)
          DEFAULT_VALUE=$([[ "${PKG_TYPE}" == "generic" || "${PKG_TYPE}" == "cockpit" ]] && echo "true" || echo "false")

          # null evaluates to empty string in yq
          OS_IND=$(yq '.os-independent' package_options.yml)
          ARCH_IND=$(yq '.arch-independent' package_options.yml)

          [ "${OS_IND}" == "null" ] && OS_IND="${DEFAULT_VALUE}"
          [ "${ARCH_IND}" == "null" ] && ARCH_IND="${DEFAULT_VALUE}"

          if "${OS_IND}"; then
            distros=(focal)
          else
            distros=(focal jammy noble)
          fi

          arches=(amd64)
          if ! "${ARCH_IND}"; then
            arches+=(arm64)
          fi

          # Convert array to JSON array format
          json_distros="[$(printf '"%s"\n' "${distros[@]}" | paste -sd ',' -)]"
          json_arches="[$(printf '"%s"\n' "${arches[@]}" | paste -sd ',' -)]"

          {
            echo "distros=${json_distros}"
            echo "arches=${json_arches}"
            echo "package=${package}"
            echo "version=${GITHUB_REF_NAME#*/[vV]}"
          } | tee -a "${GITHUB_OUTPUT}"

  build-package:
    needs: check-configs
    name: Build Package

    strategy:
      matrix:
        distro: ${{ fromJSON(needs.check-configs.outputs.distros) }}
        arch: ${{ fromJSON(needs.check-configs.outputs.arches) }}

    runs-on: ${{ matrix.distro }}-${{ matrix.arch }}-ephemeral

    outputs:
      PREFIX: ${{ steps.setup.outputs.prefix }}
      PACKAGE: ${{ steps.setup.outputs.package }}
      VERSION: ${{ steps.build_package.outputs.version-number }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          sparse-checkout: "/${{ needs.check-configs.outputs.package }}"
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - name: Install UPX
        if: ${{ (contains(github.ref_name, 'caddy') || contains(github.ref_name, 'frp')) }}
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Install Go
        if: ${{ contains(github.ref_name, 'caddy') }}
        uses: actions/setup-go@v6
        with:
          go-version: 'stable' # Latest stable version

      - name: Package Setup
        id: setup
        env:
          PACKAGE: ${{ needs.check-configs.outputs.package }}
        run: |
          tar cf - --remove-files -C "${PACKAGE}/" . | tar xvf -
          rm -rf "packages"

          PREFIX="${PACKAGE#packages/}/"
          echo "PREFIX=${PREFIX}" | tee -a "${GITHUB_ENV}"

          {
            echo "prefix=${PREFIX}"
            echo "package=${PREFIX%/*}"
            echo 'package_options<<EOF'
            yq -o json < package_options.yml | jq '."atom-python3-token" = "${{ secrets.ORG_GIT_TOKEN }}"'
            echo EOF
          } >> "${GITHUB_OUTPUT}"

          rm package_options.yml

      - name: Build Package
        id: build_package
        uses: RobertDeRose/common-build-scripts/actions/package@v3
        with: ${{ fromJson(steps.setup.outputs.package_options) }}

  release-package:
    name: Release Package
    runs-on: ubuntu-24.04
    needs:
      - build-package
      - check-configs

    steps:
    - name: Make Release
      uses: RobertDeRose/common-build-scripts/actions/create-release@v3
      with:
        version: ${{ needs.build-package.outputs.VERSION }}
        version_prefix: ${{ needs.build-package.outputs.PREFIX }}
        title: ${{ needs.build-package.outputs.PACKAGE}} v${{ needs.build-package.outputs.VERSION }}
