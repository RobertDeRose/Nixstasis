name: Release Client

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version whose draft GitHub release receives the artifacts
        required: true
        type: string
  push:
    branches:
      - "**"
    paths:
      - packages/client/**
      - packages/frp/**
      - prod.env
      - .github/workflows/release_client.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.version != '' && format('v{0}', inputs.version) || '' }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: packages/client/go.mod
      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # ratchet:goreleaser/goreleaser-action@v7.2.3
        with:
          install-only: true
      - name: Install self-extracting installer tools
        working-directory: .
        run: |
          packages/client/build/bin/install_makeself.sh
          echo "$GITHUB_WORKSPACE/packages/client/build/tools/makeself/bin" >> "$GITHUB_PATH"
      - name: Build snapshot artifacts
        if: inputs.version == ''
        run: goreleaser release --snapshot --clean
      - name: Verify snapshot artifacts
        if: inputs.version == ''
        run: ./build/bin/verify_artifacts.sh
      - name: Verify snapshot self-extracting installers
        if: inputs.version == ''
        run: VERIFY_INSTALLERS=true ./build/bin/verify_artifacts.sh
      - name: Upload snapshot artifacts
        if: inputs.version == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: nixstasis-client-snapshot
          path: packages/client/dist
      - name: Build release artifacts
        if: inputs.version != ''
        run: goreleaser release --clean --skip=publish
      - name: Verify release artifacts
        if: inputs.version != ''
        run: ./build/bin/verify_artifacts.sh
      - name: Verify release self-extracting installers
        if: inputs.version != ''
        run: VERIFY_INSTALLERS=true ./build/bin/verify_artifacts.sh
      - name: Publish release artifacts
        if: inputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          assets=(
            dist/nixstasis_*.deb
            dist/nixstasis-*.rpm
            dist/nixstasis_*_linux_*.tar.gz
            dist/makeself/*/*/nixstasis-*-linux-*.run
            dist/nixstasis_*_checksums.txt
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release artifacts found in dist/." >&2
            exit 1
          fi
          gh release upload "v${RELEASE_VERSION}" "${assets[@]}" --clobber
