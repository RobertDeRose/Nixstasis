name: Validation
on:
  pull_request:
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # ratchet:jdx/mise-action@v5.1.1
        with:
          install: false
      - name: Install locked tools
        env:
          MISE_IGNORED_CONFIG_PATHS: /home/runner/.config/mise/config.toml
        run: mise install --locked
      - name: Install server dependencies
        working-directory: packages/server
        env:
          MISE_IGNORED_CONFIG_PATHS: /home/runner/.config/mise/config.toml
        run: |
          mise x -- mix local.hex --force
          mise x -- mix local.rebar --force
          mise x -- mix deps.get
      - name: Run repository checks
        env:
          MISE_IGNORED_CONFIG_PATHS: /home/runner/.config/mise/config.toml
        run: mise run check
