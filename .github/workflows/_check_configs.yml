name: Check Config
on:
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: package
    outputs:
      package:
        value: ${{ jobs.check-configs.outputs.package }}
      version:
        value: ${{ jobs.check-configs.outputs.version }}
      distros:
        value: ${{ jobs.check-configs.outputs.distros }}
      arches:
        value: ${{ jobs.check-configs.outputs.arches }}
      os-independent:
        value: ${{ jobs.check-configs.outputs.os-independent }}
      arch-independent:
        value: ${{ jobs.check-configs.outputs.arch-independent }}

jobs:
  check-configs:
    name: Checking Build Request
    runs-on: ubuntu-24.04

    outputs:
      package: ${{ steps.parameters.outputs.package }}
      version: ${{ steps.parameters.outputs.version }}
      distros: ${{ steps.parameters.outputs.distros }}
      arches: ${{ steps.parameters.outputs.arches }}
      os-independent: ${{ steps.parameters.outputs.os-independent }}
      arch-independent: ${{ steps.parameters.outputs.arch-independent }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Get Parameters
        id: parameters
        run: |
          mode="${{ inputs.mode }}"

          if [ "$mode" = "images" ]; then
            {
              echo 'distros=["ubuntu-24.04"]'
              echo 'arches=["amd64"]'
              echo 'package=images'
              echo "version=${GITHUB_REF_NAME#*/[vV]}"
              echo 'os-independent=true'
              echo 'arch-independent=false'
            } | tee -a "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "$mode" = "client-release" ]; then
            {
              echo 'distros=["ubuntu-24.04"]'
              echo 'arches=["amd64","arm64"]'
              echo 'package=packages/client'
              echo "version=${GITHUB_REF_NAME#*/[vV]}"
              echo 'os-independent=false'
              echo 'arch-independent=false'
            } | tee -a "${GITHUB_OUTPUT}"
            exit 0
          fi

          package="packages/${GITHUB_REF_NAME%/*}"

          if grep -qP "packages/v(\d+\.){2,3}(\d+)?" <<< "${package}"; then
            package="packages/server"
          fi

          if [[ ! -e "${package}" || ! -e "${package}/package_options.yml" ]]; then
            echo "Invalid Build Request, there is no ${package} folder or 'package_options.yml' is missing"
            exit 1
          fi

          cd "${package}"

          PKG_TYPE=$(yq '.package-type' package_options.yml)
          DEFAULT_VALUE=$([[ "${PKG_TYPE}" == "generic" || "${PKG_TYPE}" == "cockpit" ]] && echo "true" || echo "false")

          # null evaluates to empty string in yq
          OS_IND=$(yq '.os-independent' package_options.yml)
          ARCH_IND=$(yq '.arch-independent' package_options.yml)

          [ "${OS_IND}" == "null" ] && OS_IND="${DEFAULT_VALUE}"
          [ "${ARCH_IND}" == "null" ] && ARCH_IND="${DEFAULT_VALUE}"

          if "${OS_IND}"; then
            distros=(focal)
          else
            distros=(focal jammy noble)
          fi

          arches=(amd64)
          if ! "${ARCH_IND}"; then
            arches+=(arm64)
          fi

          # Convert array to JSON array format
          json_distros="[$(printf '"%s"\n' "${distros[@]}" | paste -sd ',' -)]"
          json_arches="[$(printf '"%s"\n' "${arches[@]}" | paste -sd ',' -)]"

          {
            echo "distros=${json_distros}"
            echo "arches=${json_arches}"
            echo "package=${package}"
            echo "version=${GITHUB_REF_NAME#*/[vV]}"
            echo "os-independent=${OS_IND}"
            echo "arch-independent=${ARCH_IND}"
          } | tee -a "${GITHUB_OUTPUT}"
