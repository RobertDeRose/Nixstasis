name: Check Config
on:
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: images
    outputs:
      package:
        value: ${{ jobs.check-configs.outputs.package }}
      version:
        value: ${{ jobs.check-configs.outputs.version }}
      distros:
        value: ${{ jobs.check-configs.outputs.distros }}
      arches:
        value: ${{ jobs.check-configs.outputs.arches }}
      os-independent:
        value: ${{ jobs.check-configs.outputs.os-independent }}
      arch-independent:
        value: ${{ jobs.check-configs.outputs.arch-independent }}

jobs:
  check-configs:
    name: Checking Build Request
    runs-on: ubuntu-24.04

    outputs:
      package: ${{ steps.parameters.outputs.package }}
      version: ${{ steps.parameters.outputs.version }}
      distros: ${{ steps.parameters.outputs.distros }}
      arches: ${{ steps.parameters.outputs.arches }}
      os-independent: ${{ steps.parameters.outputs.os-independent }}
      arch-independent: ${{ steps.parameters.outputs.arch-independent }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Get Parameters
        id: parameters
        run: |
          mode="${{ inputs.mode }}"

          if [ "$mode" = "images" ]; then
            {
              echo 'distros=["ubuntu-24.04"]'
              echo 'arches=["amd64"]'
              echo 'package=images'
              echo "version=${GITHUB_REF_NAME#*/[vV]}"
              echo 'os-independent=true'
              echo 'arch-independent=false'
            } | tee -a "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "$mode" = "client-release" ]; then
            {
              echo 'distros=["ubuntu-24.04"]'
              echo 'arches=["amd64","arm64"]'
              echo 'package=packages/client'
              echo "version=${GITHUB_REF_NAME#*/[vV]}"
              echo 'os-independent=false'
              echo 'arch-independent=false'
            } | tee -a "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Unsupported mode: $mode" >&2
          exit 1
