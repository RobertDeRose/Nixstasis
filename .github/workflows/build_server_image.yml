name: Build Server Image

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the built image to GHCR
        required: false
        type: boolean
        default: false
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - packages/server/**
      - deploy/compose/**
      - .github/workflows/build_server_image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Load production version pins
        run: cat prod.env >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # ratchet:docker/setup-buildx-action@v4.4.1
      - name: Validate runtime contract
        run: deploy/compose/scripts/check_runtime_contract.sh
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.push)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # ratchet:docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # ratchet:docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nixstasis-server
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and optionally push server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # ratchet:docker/build-push-action@v7.4.0
        with:
          context: packages
          file: packages/server/Dockerfile
          build-args: |
            ELIXIR_BUILDER_IMAGE_DIGEST=${{ env.ELIXIR_BUILDER_IMAGE_DIGEST }}
            UBUNTU_RUNNER_VERSION=${{ env.UBUNTU_RUNNER_VERSION }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
