name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - e2e-results/**
      - mise.toml
      - .github/workflows/docs.yml
  workflow_run:
    workflows:
      - E2E Suites Report
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Checkout E2E results
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        continue-on-error: true
        with:
          ref: e2e-results
          path: e2e-results

      - name: Install mise tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # ratchet:jdx/mise-action@v5.1.1
        with:
          experimental: true

      - name: Prepare E2E results page
        run: bash docs/scripts/prepare_e2e_results.sh e2e-results docs/src/reference/e2e-results.md

      - name: Build docs
        run: mise exec -- mdbook build docs

      - name: Include E2E reports
        run: |
          if [ -f e2e-results/runs.json ]; then
            mkdir -p book/e2e-results
            cp -R e2e-results/. book/e2e-results/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # ratchet:actions/upload-pages-artifact@v5.0.0
        with:
          path: ./book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # ratchet:actions/deploy-pages@v5.0.1
