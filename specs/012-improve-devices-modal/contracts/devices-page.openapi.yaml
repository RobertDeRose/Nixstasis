openapi: 3.0.3
info:
  title: Devices Page Filtering Contract
  version: 1.0.0
  description: |
    Contract for Devices page filtering interactions. Device detail sessions are
    launched through the Phoenix LiveView route, not modal REST endpoints.
servers:
  - url: https://nixstasis.local
paths:
  /api/v1/devices:
    get:
      summary: List devices with optional additive filters
      parameters:
        - in: query
          name: product
          schema:
            type: string
          description: Exact product filter.
        - in: query
          name: account_number
          schema:
            type: string
          description: Exact account number filter.
        - in: query
          name: status
          schema:
            type: string
          description: Exact device status filter.
      responses:
        "200":
          description: Filtered devices list
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceListRow'
                  meta:
                    $ref: '#/components/schemas/FilterMeta'

components:
  schemas:
    DeviceListRow:
      type: object
      required:
        - device_id
        - mac_address
        - status
      properties:
        device_id:
          type: string
        mac_address:
          type: string
        product:
          type: string
          nullable: true
        account_number:
          type: string
          nullable: true
        status:
          type: string

    FilterMeta:
      type: object
      required: [active_filters]
      properties:
        active_filters:
          type: object
          properties:
            product:
              type: string
              nullable: true
            account_number:
              type: string
              nullable: true
            status:
              type: string
              nullable: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
