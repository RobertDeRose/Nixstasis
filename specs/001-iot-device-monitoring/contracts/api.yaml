openapi: 3.0.0
info:
  title: IoT Device Monitoring API
  version: 1.0.0
  description: API for Device Registration, Heartbeats, and Telemetry.

paths:
  /api/v1/devices/register:
    post:
      summary: Register a new device or update schema
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mac_address
                - schema
              properties:
                mac_address:
                  type: string
                  example: "00:1A:2B:3C:4D:5E"
                schema:
                  type: object
                  required:
                    - product
                  properties:
                    product:
                      type: string
                      example: "sensor-node-v1"
                    fields:
                      type: object
                      description: "Key-value pairs defining field types"
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "approved"
        '202':
          description: Registration pending approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "pending"
        '400':
          description: Invalid schema or missing product name

  /api/v1/devices/heartbeat:
    post:
      summary: Send heartbeat and optional telemetry
      operationId: sendHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mac_address
              properties:
                mac_address:
                  type: string
                telemetry:
                  type: object
                  description: "Optional data payload"
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  commands:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        command:
                          type: string
                        payload:
                          type: object

  /api/v1/devices/telemetry:
    post:
      summary: Send high-volume telemetry data (separate from heartbeat)
      operationId: sendTelemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mac_address
                - data
              properties:
                mac_address:
                  type: string
                data:
                  type: object
      responses:
        '202':
          description: Data accepted
