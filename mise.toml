[settings]
experimental = true
env_shell_expand = true

[tools]
elixir = "1.19.5-otp-28"
erlang = "28.5"
go = "1.26.2"
golangci-lint = "2.12.0"
goreleaser = "2.15.4"
"github:badboy/mdbook-mermaid" = "0.17.0"
"github:joshrotenberg/mdbook-lint" = "0.14.3"
hk = "latest"
mdbook = "0.5.2"
node = "lts"
"npm:@commitlint/cli" = "20.5.3"
pkl = "0.31.0"
typos = "latest"

[env]
HK_MISE = 1

[hooks]
postinstall = "command -v hk >/dev/null && hk install --mise || true"

[tasks."docs:build"]
description = "Build the documentation site (mdBook)"
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail

cd docs
mdbook build
'''

[tasks."docs:serve"]
description = "Serve the documentation site locally with hot-reload"
quiet = true
usage = 'arg "[port]" help="Port to serve on" default="3000"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

PORT="${usage_port:-3000}"

cd docs
mdbook serve --port "$PORT"
'''
