monorepo_root = true

[settings]
experimental = true
env_shell_expand = true

[monorepo]
config_roots = [".", "packages/client", "packages/server"]

[tools]
"npm:@commitlint/cli" = "latest"
"npm:@contextlint/cli" = { version = "latest", aube_args = "--allow-low-downloads" }
"npm:markdown-table-formatter" = "latest"
cocogitto = "latest"
go = "latest"
goreleaser = "latest"
hk = "latest"
node = "lts"
pkl = "latest"
rumdl = "latest"
typos = "latest"
uv = "latest"

[env]
GIT_CONFIG_PARAMETERS = "'merge.ff=only'"
HK_MISE = 1

[hooks]
postinstall = "command -v hk >/dev/null && hk install --mise || true"

[tasks.check]
description = "Run repository validation"
run = "hk check -a"

[tasks.fix]
description = "Apply deterministic repository fixes"
run = "hk fix -a"

[tasks.lock]
description = "Regenerate every mise.lock for the supported platforms"
usage = 'flag "--bump" help="Re-resolve latest versions instead of keeping the locked ones"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

for root in . packages/client packages/server; do
  (cd "$root" && mise lock --yes --platform linux-x64,linux-arm64,macos-arm64 ${usage_bump:+--bump})
done
'''

[tasks."docs:install"]
description = "Install the documentation site dependencies from the npm lockfile"
dir = "website"
sources = ["package-lock.json", "package.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci --no-fund --no-audit"

[tasks."docs:build"]
description = "Build the documentation site (Docusaurus)"
depends = ["docs:install"]
dir = "website"
run = "npm run build"

[tasks."docs:deployment:enable"]
description = "Enable GitHub Pages deployment"
run = "python3 scripts/enable-docs-deployment.py"

[tasks."docs:serve"]
description = "Serve the documentation site locally with hot-reload"
depends = ["docs:install"]
dir = "website"
usage = 'arg "[port]" help="Port to serve on" default="3000"'
run = 'npm run start -- --port "${usage_port:-3000}"'

[tasks."site:build"]
description = "Assemble the Pages site: the product page at the root and the docs under docs/"
depends = ["docs:build"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

# The Pages site is served from /nixstasis/, so the output keeps that path for local previews.
out=_site/nixstasis
# The fonts come from the docs' npm packages, which docs:build installs through docs:install.
fonts=website/node_modules/@fontsource
rm -rf _site
mkdir -p "$out/fonts"
cp -R site/. "$out/"
cp -R website/build "$out/docs"
# GitHub Pages serves 404.html from the site root for every missing path.
cp website/build/404.html "$out/404.html"
cp "${fonts}-variable/sora/files/sora-latin-wght-normal.woff2" \
  "$fonts"/ibm-plex-sans/files/ibm-plex-sans-latin-{400,600}-normal.woff2 \
  "$fonts/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2" \
  "$out/fonts/"
'''

[tasks."site:serve"]
description = "Build the Pages site and serve it at http://127.0.0.1:<port>/nixstasis/"
depends = ["site:build"]
usage = 'arg "[port]" help="Port to serve on" default="3000"'
run = 'python3 scripts/serve-pages.py _site --port "${usage_port:-3000}"'
