experimental_monorepo_root = true

[settings]
experimental = true
env_shell_expand = true

[monorepo]
config_roots = [".", "packages/client", "packages/server"]

[tools]
"github:RobertDeRose/mdbook-mermaid" = "1.1.1"
"github:joshrotenberg/mdbook-lint" = "0.14.3"
"github:rust-lang/mdbook" = "0.5.2"
"npm:@commitlint/cli" = "20.5.3"
"npm:@contextlint/cli" = { version = "latest", aube_args = "--allow-low-downloads" }
"npm:markdown-table-formatter" = "latest"
cocogitto = "latest"
go = "1.26.2"
goreleaser = "2.15.4"
harper-cli = "latest"
hk = "latest"
node = "lts"
pkl = "0.31"
rumdl = "latest"
typos = "latest"
uv = "latest"

[env]
GIT_CONFIG_PARAMETERS = "'merge.ff=only'"
HK_MISE = 1

[hooks]
postinstall = "command -v hk >/dev/null && hk install --mise || true"

[tasks.check]
description = "Run repository validation"
run = "hk check -a"

[tasks.fix]
description = "Apply deterministic repository fixes"
run = "hk fix -a"

[tasks."docs:check"]
description = "Validate and build the documentation"
depends = ["docs:build"]
run = "uv run scripts/check-docs.py"

[tasks."docs:build"]
description = "Build the documentation site (mdBook)"
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail

cd docs
mdbook build
'''

[tasks."docs:deployment:enable"]
description = "Enable GitHub Pages deployment"
run = "python3 scripts/enable-docs-deployment.py"

[tasks."docs:serve"]
description = "Serve the documentation site locally with hot-reload"
quiet = true
usage = 'arg "[port]" help="Port to serve on" default="3000"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

PORT="${usage_port:-3000}"

cd docs
mdbook serve --port "$PORT"
'''
