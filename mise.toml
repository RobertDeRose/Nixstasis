experimental_monorepo_root = true

[settings]
experimental = true
env_shell_expand = true

[monorepo]
config_roots = ["packages/client"]

[tools]
"github:RobertDeRose/mdbook-mermaid" = "1.0"
"github:joshrotenberg/mdbook-lint" = "0.14.3"
"github:rust-lang/mdbook" = "0.5.2"
"npm:@commitlint/cli" = "20.5.3"
elixir = "1.19.5-otp-28"
erlang = "28.5"
go = "1.26.2"
goreleaser = "2.15.4"
hk = "latest"
node = "lts"
pkl = "0.31"
typos = "latest"

[env]
HK_MISE = 1

[hooks]
postinstall = "command -v hk >/dev/null && hk install --mise || true"
