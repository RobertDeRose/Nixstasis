api:
  url: "https://nixstasis.example.com"

poll:
  interval: 30s

scripts:
  dir: "/usr/libexec/nixstasis/scripts"

frp:
  auth_token: ""
  name: ""
  server_addr: "nixstasis.example.com"
  server_port: 7000
  web_server_addr: "127.0.0.1"
  web_server_port: 7400
  http_local_addr: "127.0.0.1:443"
  ssh_local_port: 22
  allowed_plugin_kinds:
    - "http2https"
  profiles:
    default:
      version: 1
      routes:
        - name: "web"
          kind: "http2https"
          local_addr: "127.0.0.1:443"
        - name: "ssh"
          kind: "tcpmux"
          local_port: 22
        - name: "pcp"
          kind: "tcpmux"
          local_port: 44321
    atomixos-bootstrap:
      version: 1
      routes:
        - name: "provisioning"
          kind: "http"
          local_addr: "127.0.0.1:8080"

runtime:
  mqtt_broker: "tcp://localhost:1883"
  exec_work_dir: "/"
  exec_env:
    - "LANG=C"
  exec_commands:
    uname: "/usr/bin/uname"
    cat: "/usr/bin/cat"
    df: "/usr/bin/df"
    stat: "/usr/bin/stat"
    nproc: "/usr/bin/nproc"
    pcp-metrics: "/usr/libexec/nixstasis/pcp-metrics.sh"
  mqtt_publish_topics:
    - "nixstasis/+/request"
  mqtt_subscribe_topics:
    - "nixstasis/+/response"

log:
  level: "info"
  format: "text"
