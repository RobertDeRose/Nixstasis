api:
  url: "https://nixstasis.example.com"

poll:
  interval: 30s

scripts:
  dir: "/usr/libexec/nixstasis/scripts"

frp:
  auth_token: ""
  name: "atom-001122334455"

runtime:
  mqtt_broker: "tcp://localhost:1883"
  authorized_keys_path: "/var/lib/nixstasis/.ssh/authorized_keys"
  exec_work_dir: "/"
  exec_env:
    - "LANG=C"
  exec_commands:
    uname: "/usr/bin/uname"
    cat: "/usr/bin/cat"
    df: "/usr/bin/df"
    stat: "/usr/bin/stat"
    nproc: "/usr/bin/nproc"
  mqtt_publish_topics:
    - "nixstasis/+/request"
  mqtt_subscribe_topics:
    - "nixstasis/+/response"

log:
  level: "info"
  format: "text"
