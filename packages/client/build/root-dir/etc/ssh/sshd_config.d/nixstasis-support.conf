# Nixstasis in-memory SSH authorization drop-in.
#
# The Nixstasis poll loop serves SSH public keys over a local Unix-domain
# socket. The ssh-authorized-keys wrapper (a shell script) sets the
# NIXSTASIS_SSH_AUTHORITY_SOCKET env var and execs the production
# `nixstasis ssh-authorized-keys` helper, which queries the socket and
# prints the canonical authorized_keys line on match.
#
# AuthorizedKeysFile is set to "none" so sshd never falls back to a
# file on disk for the nixstasis-support account. AuthorizedKeysCommand
# runs as the dedicated nixstasis-ssh-authority user, which is a member
# of the nixstasis-ssh group that owns the socket.

Match User nixstasis-support
    PubkeyAuthentication yes
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/libexec/nixstasis/ssh-authorized-keys %u %t %k
    AuthorizedKeysCommandUser nixstasis-ssh-authority
