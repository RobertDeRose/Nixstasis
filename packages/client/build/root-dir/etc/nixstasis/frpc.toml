# FRP Client Configuration Template
# This file is processed by 'gomplate' or similar (implied by {{ ... }} syntax) before being used by frpc.

serverAddr = "nixstasis.example.com"
serverPort = 7000
webServer.addr = "127.0.0.1"
webServer.port = 7400
log.to = "console"

# Proxy Configuration 1: HTTP Access to Local Web Server
# Exposes the local web server (port 443) via a subdomain on the FRP server.
[[proxies]]
# Unique name for this proxy, derived from the environment variable NAME (e.g., atom-12345)
name = "{{ .Envs.NAME }}"
type = "http"
# The subdomain requested on the server (e.g., atom-<normalized-device-id>.<base-domain>)
subdomain = "{{ .Envs.NAME }}"

[proxies.plugin]
# The 'http2https' plugin bridges the incoming HTTP request to the local HTTPS server
type = "http2https"
localAddr = "127.0.0.1:443"

# Proxy Configuration 2: SSH Access
# Exposes the local SSH server (port 22) via TCP multiplexing.
[[proxies]]
name = "{{ .Envs.NAME }}-ssh"
# 'tcpmux' allows multiple SSH connections to share the single server port (2022 defined in frps.toml)
type = "tcpmux"
multiplexer = "httpconnect"
# The custom domain used to route the connection (e.g., atom-12345-ssh)
customDomains = ["{{ .Envs.NAME }}-ssh"]
localPort = 22
