id: runtime_linux_telemetry
description: "Validate runtime APIs, Starlark telemetry, reporting, and alerting"
steps:
  - action: "runtime_register_device"
    expect: "runtime_device_registered"
  - action: "runtime_check_domain"
    expect: "tls_domain_allowed"
  - action: "runtime_approve_device"
    expect: "device_approved"
  - action: "runtime_create_alert_rule"
    expect: "alert_rule_created"
  - action: "runtime_queue_payload_ref_command"
    expect: "command_payload_available"
  - action: "runtime_poll_with_scripts"
    expect: "scripts_polled_under_budget"
  - action: "runtime_verify_telemetry"
    expect: "telemetry_persisted"
  - action: "runtime_create_report"
    expect: "report_created"
  - action: "runtime_verify_report"
    expect: "report_rendered"
  - action: "runtime_verify_alert"
    expect: "alert_triggered"
  - action: "runtime_cleanup"
    expect: "runtime_resources_cleaned"
