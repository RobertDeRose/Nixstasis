version: 2

project_name: nixstasis

git:
  ignore_tags:
    - "caddy/*"
    - "client/*"
    - "frp/*"
    - "server/*"

snapshot:
  version_template: "0.0.0-snapshot-{{ .ShortCommit }}"

builds:
  - id: nixstasis
    binary: usr/bin/nixstasis
    main: ./cmd/nixstasis
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=jsonv2
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    hooks:
      post:
        - cmd: bash -x ./scripts/fetch_frpc.sh {{ .Arch }}

archives:
  - id: nixstasis-archive
    ids:
      - nixstasis
    formats: [tar.gz]
    files:
      - src: build/root-dir/**/*
        dst: .

nfpms:
  - id: nixstasis
    ids:
      - nixstasis
    package_name: nixstasis
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: RobertDeRose
    homepage: https://github.com/RobertDeRose/Nixstasis
    description: Nixstasis client with bundled frpc
    maintainer: Robert DeRose <RobertDeRose@users.noreply.github.com>
    license: Proprietary
    formats:
      - deb
      - rpm
    scripts:
      postinstall: ./scripts/release/postinstall.sh
      preremove: ./scripts/release/preremove.sh
    contents:
      - src: build/root-dir/
        dst: .

makeselfs:
  - id: nixstasis-installer
    ids:
      - nixstasis
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    name: nixstasis
    description: Nixstasis client with bundled frpc
    filename: "nixstasis-{{ .Version }}-{{ .Os }}-{{ .Arch }}.run"
    script: scripts/release/makeself-entrypoint.sh
    extra_args:
      - "--nox11"
      - "--needroot"
      - "--target"
      - "/"
    files:
      - src: build/root-dir/**/*
        dst: .
      - src: scripts/release/postinstall.sh
        dst: usr/libexec/nixstasis/postinstall.sh
      - src: scripts/release/makeself-cleanup.sh
        dst: usr/libexec/nixstasis/makeself-cleanup.sh
