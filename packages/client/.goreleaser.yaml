version: 2

project_name: nixstasis

git:
  ignore_tags:
    - "caddy/*"
    - "client/*"
    - "frp/*"
    - "server/*"

snapshot:
  version_template: "0.0.0-snapshot-{{ .ShortCommit }}"

before:
  hooks:
    - ./scripts/fetch_frpc.sh

builds:
  - id: nixstasis
    binary: nixstasis
    main: ./cmd/nixstasis
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=jsonv2
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: nixstasis-archive
    ids:
      - nixstasis
    formats: [tar.gz]
    files:
      - src: build/root-dir/usr/share/nixstasis/frpc.toml
        dst: usr/share/nixstasis/frpc.toml
      - src: build/root-dir/usr/share/nixstasis/config.example.yaml
        dst: usr/share/nixstasis/config.example.yaml
      - src: build/root-dir/usr/libexec/nixstasis/frpc_{{ .Arch }}
        dst: usr/libexec/nixstasis/frpc

nfpms:
  - id: nixstasis
    ids:
      - nixstasis
    package_name: nixstasis
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Sfero
    homepage: https://github.com/RobertDeRose/Nixstasis
    description: Nixstasis client with bundled frpc
    maintainer: Sfero <support@example.com>
    license: Proprietary
    formats:
      - deb
      - rpm
    scripts:
      postinstall: ./scripts/release/postinstall.sh
      preremove: ./scripts/release/preremove.sh
    contents:
      - src: build/root-dir/usr/share/nixstasis/frpc.toml
        dst: /usr/share/nixstasis/frpc.toml
      - src: build/root-dir/usr/share/nixstasis/config.example.yaml
        dst: /usr/share/nixstasis/config.example.yaml
      - src: build/root-dir/usr/libexec/nixstasis/frpc_{{ .Arch }}
        dst: /usr/libexec/nixstasis/frpc
        file_info:
          mode: 0755
      - src: build/root-dir/lib/systemd/system/nixstasis-poll.service
        dst: /lib/systemd/system/nixstasis-poll.service
      - src: build/root-dir/lib/systemd/system/nixstasis-poll.path
        dst: /lib/systemd/system/nixstasis-poll.path
      - src: build/root-dir/lib/systemd/system/nixstasis-registration.service
        dst: /lib/systemd/system/nixstasis-registration.service
